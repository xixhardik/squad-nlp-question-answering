[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qas-nlp"
version = "0.1.0"
description = "Extractive Question Answering on SQuAD 1.1 with Transformer span prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# Deliberately empty. Runtime dependencies are governed by the layered
# requirements files so that the ML environment (CUDA, heavy) and the backend
# environment (light) can be installed independently while sharing pins via
# constraints.txt. See docs/dependencies.md.
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "backend/tests"]
# `pythonpath` makes both the src packages and the backend app importable
# without requiring an editable install, so tests run from a clean checkout.
pythonpath = ["src", "backend"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:qa_core.*"]
markers = [
    "gpu: requires a CUDA device; skipped automatically on CPU-only machines",
    "network: downloads a tokenizer or model from the Hugging Face Hub",
    "slow: takes more than a few seconds",
]

# -----------------------------------------------------------------------------
# ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "backend", "ml"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ANN", # missing type annotations
    "D",   # docstrings
    "PTH", # prefer pathlib over os.path
    "RET", # return simplification
    "SIM", # simplification
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401", # allow typing.Any where genuinely needed
]

[tool.ruff.lint.per-file-ignores]
# Test classes are organisational groupings and test method names are the
# documentation ("test_stride_must_be_smaller_than_max_seq_length" says it all).
# Requiring a docstring on every assertion would add noise, not clarity, so the
# docstring rules are relaxed for tests only. Explanatory docstrings are still
# written wherever a test encodes a non-obvious fact.
"tests/**" = [
    "D100", "D101", "D102", "D103", "D105", "D106", "D107",
    # Test helpers and fixtures do not need full type annotations; the assertions
    # are the specification and annotating pytest plumbing adds noise, not clarity.
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
]
"backend/tests/**" = [
    "D100", "D101", "D102", "D103", "D105", "D106", "D107",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
]
"ml/scripts/**" = ["T201"]  # diagnostics scripts legitimately print

[tool.ruff.lint.pydocstyle]
convention = "google"
