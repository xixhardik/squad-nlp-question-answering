# =============================================================================
# base.yaml - shared defaults for every experiment
# =============================================================================
# Experiment files inherit from this with `extends: base.yaml` and override only
# what genuinely differs. Keeping the shared values in one place is what makes
# the model comparison a controlled experiment rather than four unrelated runs.
#
# Loaded by qa_ml.config.load_experiment_config(). Unknown keys are rejected.
# =============================================================================

name: base
description: >-
  Shared defaults. Not runnable on its own; experiment configs extend this file.

# Overridden by every experiment. Present here so the schema is complete.
model_name: distilbert-base-uncased

# Defaults to model_name when null. Set explicitly only when the tokenizer and
# the model come from different repositories.
tokenizer_name: null

# Global seed. Controls weight init of the QA head, data shuffling and dropout.
seed: 42

data:
  dataset_name: rajpurkar/squad
  # "main" is acceptable during development. Pin a commit sha before any run
  # whose numbers will be published, so the data behind a metric is unambiguous.
  dataset_version: main
  train_split: train
  validation_split: validation
  # null = use the full split. Verified split sizes: train 87,599 / validation
  # 10,570 examples.
  max_train_samples: null
  max_eval_samples: null

preprocessing:
  # 384 is the standard SQuAD setting: long enough that most contexts fit in a
  # single window, short enough to keep attention cost reasonable.
  max_seq_length: 384
  # Token overlap between consecutive windows of a long context. Must exceed the
  # typical answer length, otherwise an answer can straddle every window
  # boundary and appear in none of them completely.
  doc_stride: 128
  max_question_length: 64
  # max_length keeps every feature the same width, which makes the alignment
  # tests deterministic. Dynamic padding is a Phase L throughput experiment.
  padding: max_length
  pad_to_multiple_of: null

decoding:
  # Shared verbatim by training-time evaluation and production inference.
  n_best_size: 20
  # In tokens. SQuAD answers are short; this filters implausibly long spans.
  max_answer_length: 30
  # Honest label. A single softmax over the pooled set of valid candidate spans
  # from all windows is a proper distribution over considered hypotheses, but it
  # is NOT calibrated. Only change this after actually fitting a temperature and
  # measuring calibration error.
  score_type: uncalibrated_span_probability

training:
  learning_rate: 3.0e-5
  batch_size: 16
  eval_batch_size: 64
  gradient_accumulation_steps: 1
  # 2 epochs is the conventional SQuAD fine-tuning budget. With four models to
  # compare inside a fixed GPU allowance, a third epoch is not worth ~50% more
  # compute per experiment.
  num_train_epochs: 2
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  # fp32 is the SAFE DEFAULT and is deliberately not fp16/bf16. Mixed precision
  # is enabled per experiment only after being benchmarked on the actual L4 in
  # Phase 2, per the "measure it, do not assume it" requirement.
  precision: fp32
  evaluation_strategy: epoch
  save_strategy: epoch
  logging_strategy: steps
  logging_steps: 50
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  # 0 on Windows: worker processes there are spawned, not forked, which makes
  # them slow to start and awkward to debug. Tuned upward on Linux in Phase 2.
  dataloader_num_workers: 0
  gradient_checkpointing: false
  resume_from_checkpoint: null
